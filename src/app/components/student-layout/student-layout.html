<div class="h-screen w-full flex overflow-hidden bg-gray-50 text-gray-800 font-sans">

  <!-- Mobile Header -->
  <div class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-100 lg:hidden">
    <div class="flex items-center justify-between p-4" [class.flex-row-reverse]="t.isRTL">
      <button (click)="toggleSidebar()" class="text-gray-600 p-2 hover:bg-gray-100 rounded-lg">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-sm">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
        </div>
        <span class="text-xl font-bold text-gray-900 tracking-tight">Codik Academy</span>
      </div>
    </div>
  </div>

  <!-- Sidebar Backdrop for Mobile -->
  @if (sidebarOpen) {
    <div class="fixed inset-0 bg-black/50 z-40 lg:hidden" (click)="toggleSidebar()"></div>
  }

  <!-- Left column: Navigation sidebar -->
  <div class="fixed lg:static inset-y-0 z-50 w-64 bg-white border-r border-gray-100 flex-shrink-0 transition-transform duration-300 lg:translate-x-0"
       [class.left-0]="!t.isRTL"
       [class.right-0]="t.isRTL"
       [class.-translate-x-full]="!sidebarOpen && !t.isRTL"
       [class.translate-x-full]="!sidebarOpen && t.isRTL"
       [class.translate-x-0]="sidebarOpen"
       [class.border-r]="!t.isRTL"
       [class.border-l]="t.isRTL">
    <app-sidebar (sidebarClose)="closeSidebar()"></app-sidebar>
  </div>

  <!-- Main content area -->
  <div class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pt-20 lg:pt-8">
    @switch (stateService.currentView()) {
      @case ('dashboard') {
        <app-dashboard></app-dashboard>
      }
      @case ('course') {
        <app-sessions-sidebar></app-sessions-sidebar>
      }
      @case ('session-details') {
        <app-session-details></app-session-details>
      }
      @case ('progress') {
        <app-my-progress></app-my-progress>
      }
      @case ('profile') {
        <app-profile></app-profile>
      }
    }
  </div>

  <!-- Bug Report Button -->
  <app-bug-report></app-bug-report>

</div>
