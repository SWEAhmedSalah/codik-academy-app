<div class="flex flex-col justify-between h-full bg-white px-4 py-6 border-l border-gray-100">

  <!-- Top: Logo + Navigation -->
  <div>
    <!-- Logo -->
    <div class="flex items-center gap-3 px-2 mb-10">
      <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
      </div>
      <span class="text-xl font-bold text-gray-900 tracking-tight">Codik Academy</span>
    </div>

    <!-- Navigation Links -->
    <nav class="space-y-1">

      <!-- Dashboard -->
      <a (click)="navigateTo('dashboard')" [class]="isActive('dashboard')
        ? 'flex items-center gap-3 px-3 py-2.5 bg-indigo-50 text-indigo-700 rounded-xl font-semibold transition-colors cursor-pointer'
        : 'flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl font-medium transition-colors cursor-pointer'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        {{ t.t('sidebar.dashboard') }}
      </a>

      <!-- My Course -->
      <a (click)="navigateTo('course')" [class]="isActive('course') || isActive('session-details')
        ? 'flex items-center gap-3 px-3 py-2.5 bg-indigo-50 text-indigo-700 rounded-xl font-semibold transition-colors cursor-pointer'
        : 'flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl font-medium transition-colors cursor-pointer'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        {{ t.t('sidebar.myCourse') }}
      </a>

      <!-- My Progress -->
      <a (click)="navigateTo('progress')" [class]="isActive('progress')
        ? 'flex items-center gap-3 px-3 py-2.5 bg-indigo-50 text-indigo-700 rounded-xl font-semibold transition-colors cursor-pointer'
        : 'flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl font-medium transition-colors cursor-pointer'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
        {{ t.t('sidebar.myProgress') }}
      </a>

      <!-- Profile -->
      <a (click)="navigateTo('profile')" [class]="isActive('profile')
        ? 'flex items-center gap-3 px-3 py-2.5 bg-indigo-50 text-indigo-700 rounded-xl font-semibold transition-colors cursor-pointer'
        : 'flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl font-medium transition-colors cursor-pointer'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        {{ t.t('sidebar.profile') }}
      </a>

    </nav>
  </div>

  <!-- Bottom: User profile + actions -->
  <div class="space-y-2">
    <div class="flex items-center justify-between p-3 rounded-xl hover:bg-gray-50 transition-colors border border-transparent hover:border-gray-100">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gray-200 overflow-hidden flex-shrink-0">
          <img [src]="'https://ui-avatars.com/api/?name=' + userName + '&background=e0e7ff&color=4f46e5&bold=true'" [alt]="userName" class="w-full h-full object-cover">
        </div>
        <div class="overflow-hidden">
          <p class="text-sm font-bold text-gray-900 truncate">{{ userName || 'Student' }}</p>
          <p class="text-xs text-gray-500">{{ t.t('sidebar.studentRole') }}</p>
        </div>
      </div>
    </div>

    <!-- Language toggle -->
    <button
      (click)="t.toggleLanguage()"
      class="w-full flex items-center gap-3 px-3 py-2.5 text-gray-500 hover:bg-gray-50 hover:text-gray-900 rounded-xl font-medium transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
      </svg>
      {{ t.t('lang.switchLanguage') }}
    </button>

    <!-- Logout -->
    <button
      (click)="onLogout()"
      [disabled]="isLoggingOut"
      class="w-full flex items-center gap-3 px-3 py-2.5 text-red-600 hover:bg-red-50 rounded-xl font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
      </svg>
      @if (isLoggingOut) {
        <span>{{ t.t('common.loading') }}</span>
      } @else {
        <span>{{ t.t('auth.signOut') }}</span>
      }
    </button>
  </div>

</div>
